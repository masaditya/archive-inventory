<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATK dan Perabot Arsip</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Library untuk Scan Barcode/QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Library untuk Generate Barcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
        body { background-color: #f8f9fa; }
        .admin-only { display: none; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; border: 2px dashed #0d6efd; border-radius: 8px; padding: 10px; }
        #scanResult { display: none; }
        
        #barcodeCanvas { display: none; }
        #barcodeImage { max-width: 100%; height: auto; border: 1px solid #dee2e6; border-radius: 4px; padding: 10px; background: white; margin-bottom: 15px; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-box-archive me-2"></i>ATK dan Perabot Arsip</a>
        <button id="authBtn" class="btn btn-outline-light btn-sm fw-bold" onclick="toggleAuth()">
            <i class="fa-solid fa-lock me-1"></i> Login Admin
        </button>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            
            <!-- Navigasi Tab -->
            <ul class="nav nav-pills justify-content-center mb-4 gap-2" id="pills-tab" role="tablist">
                <li class="nav-item admin-only" role="presentation">
                    <button class="nav-link" id="pills-data-tab" data-bs-toggle="pill" data-bs-target="#pills-data" type="button" role="tab" onclick="renderTabel()">
                        <i class="fa-solid fa-list me-1"></i> Daftar Barang
                    </button>
                </li>
                <li class="nav-item admin-only" role="presentation">
                    <button class="nav-link" id="pills-tambah-tab" data-bs-toggle="pill" data-bs-target="#pills-tambah" type="button" role="tab">
                        <i class="fa-solid fa-plus me-1"></i> Tambah Barang
                    </button>
                </li>
                <li class="nav-item admin-only" role="presentation">
                    <button class="nav-link" id="pills-laporan-tab" data-bs-toggle="pill" data-bs-target="#pills-laporan" type="button" role="tab" onclick="renderRiwayat()">
                        <i class="fa-solid fa-file-lines me-1"></i> Laporan
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="pills-scan-tab" data-bs-toggle="pill" data-bs-target="#pills-scan" type="button" role="tab" onclick="startScanner()">
                        <i class="fa-solid fa-camera me-1"></i> Scan Keluar
                    </button>
                </li>
            </ul>

            <!-- Konten Tab -->
            <div class="tab-content" id="pills-tabContent">
                
                <!-- TAB DAFTAR BARANG -->
                <div class="tab-pane fade admin-only" id="pills-data" role="tabpanel">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover border align-middle" id="tabelBarang">
                            <thead class="table-primary text-center">
                                <tr>
                                    <th>Barcode</th>
                                    <th>Nama Barang</th>
                                    <th>Stok</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="text-center">
                                <!-- Data dimuat via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- TAB TAMBAH BARANG -->
                <div class="tab-pane fade admin-only" id="pills-tambah" role="tabpanel">
                    <form id="formTambah" onsubmit="tambahBarang(event)" class="w-75 mx-auto">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Kode Barcode</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-barcode"></i></span>
                                <input type="text" class="form-control" id="inputBarcode" required placeholder="Scan atau ketik barcode...">
                                <button class="btn btn-outline-info" type="button" onclick="generateRandomBarcode()" title="Generate Otomatis">
                                    <i class="fa-solid fa-dice"></i> Generate
                                </button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Jenis / Nama Barang</label>
                            <input type="text" class="form-control" id="inputNama" required placeholder="Contoh: Kertas HVS A4">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Stok Awal</label>
                            <input type="number" class="form-control" id="inputStok" required min="1" placeholder="Contoh: 100">
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Simpan Barang
                        </button>
                    </form>
                </div>

                <!-- TAB LAPORAN (RIWAYAT KELUAR) -->
                <div class="tab-pane fade admin-only" id="pills-laporan" role="tabpanel">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0 text-primary"><i class="fa-solid fa-clock-rotate-left me-2"></i>Riwayat Pengeluaran</h5>
                        
                        <div class="btn-group">
                            <button class="btn btn-success btn-sm fw-bold" onclick="downloadLaporanExcel()">
                                <i class="fa-solid fa-file-excel me-1"></i> Download Excel
                            </button>
                            <button class="btn btn-danger btn-sm fw-bold" onclick="hapusRiwayat()">
                                <i class="fa-solid fa-trash me-1"></i> Bersihkan
                            </button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover border align-middle" id="tabelRiwayat">
                            <thead class="table-secondary text-center">
                                <tr>
                                    <th>Waktu Keluar</th>
                                    <th>Pengambil</th>
                                    <th>Jenis / Nama Barang</th>
                                    <th>Jml Keluar</th>
                                </tr>
                            </thead>
                            <tbody class="text-center">
                                <!-- Data riwayat akan dimuat di sini -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- TAB SCAN BARANG KELUAR -->
                <div class="tab-pane fade show active" id="pills-scan" role="tabpanel">
                    <div class="text-center mb-3">
                        <p class="text-muted"><i class="fa-solid fa-circle-info me-1"></i> Arahkan kamera ke barcode untuk memproses barang keluar.</p>
                    </div>
                    <div id="reader"></div>
                    <div id="scanResult" class="alert mt-4 text-center shadow-sm" role="alert"></div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Modal Download Barcode -->
<div class="modal fade" id="barcodeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content text-center p-3">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold w-100" id="modalTitle">Nama Barang</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-2">
                <canvas id="barcodeCanvas"></canvas>
                <img id="barcodeImage" src="" alt="Barcode">
            </div>
            <div class="modal-footer border-0 justify-content-center pt-0">
                <a id="downloadBtn" class="btn btn-success fw-bold w-100" href="#" download="barcode.jpg">
                    <i class="fa-solid fa-download me-1"></i> Download (JPEG)
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Modal Edit Barang -->
<div class="modal fade" id="editModal" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-pen-to-square me-2"></i>Edit Data Barang</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formEdit">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Barcode (Tidak bisa diubah)</label>
                        <input type="text" class="form-control font-monospace bg-light" id="editBarcode" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Jenis / Nama Barang</label>
                        <input type="text" class="form-control" id="editNama" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Jumlah Stok Saat Ini</label>
                        <input type="number" class="form-control" id="editStok" required min="0">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                <button type="button" class="btn btn-primary fw-bold" onclick="simpanEdit()">
                    <i class="fa-solid fa-save me-1"></i> Simpan Perubahan
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Input Data Scan Keluar -->
<div class="modal fade" id="qtyModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content text-center p-3 border-primary border-2">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold w-100"><i class="fa-solid fa-cart-arrow-down text-primary"></i> Proses Keluar</h5>
                <button type="button" class="btn-close" onclick="cancelScan()"></button>
            </div>
            <div class="modal-body pt-3 pb-2 text-start">
                
                <div class="text-center mb-3">
                    <h4 id="qtyItemName" class="mb-1 text-primary fw-bold">Nama Barang</h4>
                    <p class="text-muted small mb-0">Sisa Stok: <span id="qtyCurrentStock" class="badge bg-secondary">0</span></p>
                </div>
                
                <hr>

                <!-- INPUT NAMA PENGAMBIL -->
                <div class="mb-3">
                    <label class="form-label fw-bold small text-muted">Nama Pengambil: <span class="text-danger">*</span></label>
                    <input type="text" id="namaPengambil" class="form-control fw-bold" placeholder="Wajib diisi..." required>
                </div>

                <!-- INPUT JUMLAH AMBIL -->
                <div class="mb-3">
                    <label class="form-label fw-bold small text-muted">Jumlah Diambil: <span class="text-danger">*</span></label>
                    <input type="number" id="qtyInput" class="form-control text-center fs-3 fw-bold" min="1" value="1">
                </div>
                
                <input type="hidden" id="qtyBarcode">
            </div>
            <div class="modal-footer border-0 justify-content-center pt-0">
                <button type="button" class="btn btn-primary fw-bold w-100 py-2 fs-5" onclick="processScanOut()">
                    <i class="fa-solid fa-check me-1"></i> Konfirmasi
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const PASSWORD_ADMIN = "admin123";
    
    // Variabel Database (Local Storage)
    let dataGudang = JSON.parse(localStorage.getItem('dataGudang')) || [];
    let riwayatGudang = JSON.parse(localStorage.getItem('riwayatGudang')) || [];
    
    let html5QrcodeScanner = null;

    // --- SISTEM LOGIN/LOGOUT ---
    function checkAuthStatus() {
        const isAdmin = sessionStorage.getItem('isAdmin') === 'true';
        const authBtn = document.getElementById('authBtn');
        const adminElements = document.querySelectorAll('.admin-only');

        if (isAdmin) {
            authBtn.innerHTML = '<i class="fa-solid fa-unlock me-1"></i> Logout Admin';
            authBtn.classList.replace('btn-outline-light', 'btn-danger');
            adminElements.forEach(el => el.style.display = 'block');
        } else {
            authBtn.innerHTML = '<i class="fa-solid fa-lock me-1"></i> Login Admin';
            authBtn.classList.replace('btn-danger', 'btn-outline-light');
            adminElements.forEach(el => el.style.display = 'none');
            
            const scanTab = new bootstrap.Tab(document.querySelector('#pills-scan-tab'));
            scanTab.show();
            startScanner();
        }
    }

    function toggleAuth() {
        if (sessionStorage.getItem('isAdmin') === 'true') {
            sessionStorage.removeItem('isAdmin');
            alert("Anda telah keluar dari mode Admin.");
            checkAuthStatus();
        } else {
            const pass = prompt("Masukkan Password Admin:");
            if (pass === PASSWORD_ADMIN) {
                sessionStorage.setItem('isAdmin', 'true');
                checkAuthStatus();
                const dataTab = new bootstrap.Tab(document.querySelector('#pills-data-tab'));
                dataTab.show();
                renderTabel();
            } else if (pass !== null) {
                alert("Password Salah!");
            }
        }
    }

    // --- FUNGSI ADMIN: TABEL, TAMBAH, EDIT ---
    function renderTabel() {
        const tbody = document.querySelector('#tabelBarang tbody');
        tbody.innerHTML = '';
        if(dataGudang.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-muted py-3">Belum ada data ATK & Perabot.</td></tr>';
            return;
        }
        dataGudang.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="font-monospace">${item.barcode}</td>
                <td class="fw-bold">${item.nama}</td>
                <td><span class="badge bg-primary fs-6">${item.stok}</span></td>
                <td>
                    <div class="d-flex gap-1 justify-content-center">
                        <button class="btn btn-warning btn-sm" onclick="bukaModalEdit('${item.barcode}')" title="Edit">
                            <i class="fa-solid fa-pen"></i> Edit
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick="showBarcode('${item.barcode}', '${item.nama}')" title="Barcode">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function tambahBarang(e) {
        e.preventDefault();
        const barcode = document.getElementById('inputBarcode').value.trim();
        const nama = document.getElementById('inputNama').value.trim();
        const stok = parseInt(document.getElementById('inputStok').value);

        const existingItem = dataGudang.find(item => item.barcode === barcode);
        if (existingItem) {
            existingItem.stok += stok; 
            alert(`Stok ${nama} berhasil ditambahkan!`);
        } else {
            dataGudang.push({ barcode, nama, stok });
            alert(`Barang ${nama} berhasil disimpan!`);
        }

        localStorage.setItem('dataGudang', JSON.stringify(dataGudang));
        document.getElementById('formTambah').reset();
        
        const dataTab = new bootstrap.Tab(document.querySelector('#pills-data-tab'));
        dataTab.show();
        renderTabel();
    }

    function bukaModalEdit(barcode) {
        const item = dataGudang.find(i => i.barcode === barcode);
        if(item) {
            document.getElementById('editBarcode').value = item.barcode;
            document.getElementById('editNama').value = item.nama;
            document.getElementById('editStok').value = item.stok;
            
            const editModal = new bootstrap.Modal(document.getElementById('editModal'));
            editModal.show();
        }
    }

    function simpanEdit() {
        const barcode = document.getElementById('editBarcode').value;
        const namaBaru = document.getElementById('editNama').value.trim();
        const stokBaru = parseInt(document.getElementById('editStok').value);
        
        if(namaBaru === '' || isNaN(stokBaru)) {
            alert("Nama dan Stok tidak boleh kosong!");
            return;
        }

        const index = dataGudang.findIndex(i => i.barcode === barcode);
        if(index !== -1) {
            dataGudang[index].nama = namaBaru;
            dataGudang[index].stok = stokBaru;
            
            localStorage.setItem('dataGudang', JSON.stringify(dataGudang));
            renderTabel();
            
            bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
        }
    }

    function generateRandomBarcode() {
        const randomNum = Math.floor(100000000000 + Math.random() * 900000000000);
        document.getElementById('inputBarcode').value = randomNum;
    }

    function showBarcode(barcode, nama) {
        document.getElementById('modalTitle').innerText = nama;
        const canvas = document.getElementById('barcodeCanvas');
        
        JsBarcode(canvas, barcode, { 
            format: "CODE128", width: 4, height: 120, displayValue: true, 
            margin: 20, background: "#ffffff", lineColor: "#000000", fontSize: 24, fontOptions: "bold"
        });
        
        const jpegUrl = canvas.toDataURL("image/jpeg", 1.0);
        document.getElementById('barcodeImage').src = jpegUrl;

        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.href = jpegUrl;
        
        const cleanName = nama.replace(/[^a-z0-9]/gi, '_').toLowerCase();
        downloadBtn.download = `${cleanName}_${barcode}.jpg`;
        
        const barcodeModal = new bootstrap.Modal(document.getElementById('barcodeModal'));
        barcodeModal.show();
    }

    // --- FUNGSI LAPORAN & DOWNLOAD EXCEL (CSV) ---
    function renderRiwayat() {
        const tbody = document.querySelector('#tabelRiwayat tbody');
        tbody.innerHTML = '';
        
        if(riwayatGudang.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-muted py-4">Belum ada riwayat pengambilan barang.</td></tr>';
            return;
        }

        const reversedRiwayat = [...riwayatGudang].reverse();
        
        reversedRiwayat.forEach(log => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div class="fw-bold text-dark">${log.tanggal}</div>
                    <small class="text-muted">${log.waktu}</small>
                </td>
                <td class="fw-bold text-success">${log.pengambil}</td>
                <td class="fw-bold text-primary">${log.nama}</td>
                <td><span class="badge bg-danger fs-6">-${log.jumlah}</span></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function hapusRiwayat() {
        if(confirm("Apakah Anda yakin ingin menghapus SEMUA riwayat pengeluaran barang? Data tidak bisa dikembalikan.")) {
            riwayatGudang = [];
            localStorage.setItem('riwayatGudang', JSON.stringify(riwayatGudang));
            renderRiwayat();
        }
    }

    function downloadLaporanExcel() {
        if(riwayatGudang.length === 0) {
            alert("Belum ada data laporan untuk didownload.");
            return;
        }

        // Header kolom CSV (Ditambah Pengambil)
        let csvContent = "Tanggal,Waktu,Pengambil,Jenis / Nama Barang,Jumlah Keluar,Sisa Stok Saat Itu\n";
        
        const reversedRiwayat = [...riwayatGudang].reverse();
        reversedRiwayat.forEach(log => {
            const pengambilAman = log.pengambil.includes(',') ? `"${log.pengambil}"` : log.pengambil;
            const namaAman = log.nama.includes(',') ? `"${log.nama}"` : log.nama;
            
            csvContent += `${log.tanggal},${log.waktu},${pengambilAman},${namaAman},${log.jumlah},${log.sisa_stok}\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        
        link.setAttribute("href", url);
        link.setAttribute("download", `Laporan_Pengeluaran_ATK_${new Date().toISOString().slice(0,10)}.csv`);
        link.style.visibility = 'hidden';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // --- FUNGSI KAMERA SCANNER & INPUT PENGAMBIL ---
    function startScanner() {
        if(html5QrcodeScanner) return; 
        
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 10, 
            qrbox: {width: 250, height: 100}, 
            facingMode: "environment" 
        }, false);
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function onScanSuccess(decodedText, decodedResult) {
        if (html5QrcodeScanner.getState() === 2) {
            html5QrcodeScanner.pause(true); 
        }

        const itemIndex = dataGudang.findIndex(item => item.barcode === decodedText);
        const resultDiv = document.getElementById('scanResult');
        resultDiv.className = 'alert mt-4 text-center shadow-sm'; 
        
        if(itemIndex !== -1) {
            const item = dataGudang[itemIndex];
            
            if(item.stok > 0) {
                // Tampilkan Modal
                document.getElementById('qtyItemName').innerText = item.nama;
                document.getElementById('qtyCurrentStock').innerText = item.stok;
                document.getElementById('qtyInput').value = 1; 
                document.getElementById('qtyInput').max = item.stok; 
                document.getElementById('qtyBarcode').value = item.barcode; 
                document.getElementById('namaPengambil').value = ''; // Kosongkan nama
                
                const qtyModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('qtyModal'));
                qtyModal.show();
                
                return; 
            } else {
                resultDiv.classList.add('alert-danger');
                resultDiv.innerHTML = `<i class="fa-solid fa-circle-xmark fs-4"></i><br><b>Gagal!</b><br>Stok <b>${item.nama}</b> sudah habis.`;
            }
        } else {
            resultDiv.classList.add('alert-warning');
            resultDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation fs-4"></i><br><b>Tidak Ditemukan!</b><br>Barcode <span class="font-monospace fw-bold">${decodedText}</span> tidak terdaftar.`;
        }

        resultDiv.style.display = 'block';
        setTimeout(() => {
            resultDiv.style.display = 'none';
            if (html5QrcodeScanner.getState() === 3) {
                html5QrcodeScanner.resume();
            }
        }, 3000);
    }

    function processScanOut() {
        const barcode = document.getElementById('qtyBarcode').value;
        const qtyToDeduct = parseInt(document.getElementById('qtyInput').value);
        const pengambil = document.getElementById('namaPengambil').value.trim(); // Ambil input nama
        
        // VALIDASI: Nama Pengambil Wajib Diisi
        if (pengambil === "") {
            alert("Peringatan: Nama Pengambil WAJIB diisi sebelum melanjutkan!");
            document.getElementById('namaPengambil').focus();
            return; // Hentikan proses jika kosong
        }

        const itemIndex = dataGudang.findIndex(item => item.barcode === barcode);
        const resultDiv = document.getElementById('scanResult');
        resultDiv.className = 'alert mt-4 text-center shadow-sm'; 

        if (itemIndex !== -1) {
            const item = dataGudang[itemIndex];
            
            if (qtyToDeduct > 0 && qtyToDeduct <= item.stok) {
                
                item.stok -= qtyToDeduct; 
                localStorage.setItem('dataGudang', JSON.stringify(dataGudang));
                renderTabel(); 
                
                const now = new Date();
                const tgl = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                const wkt = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                
                riwayatGudang.push({
                    tanggal: tgl,
                    waktu: wkt,
                    pengambil: pengambil, // Simpan ke dalam array log
                    barcode: item.barcode,
                    nama: item.nama,
                    jumlah: qtyToDeduct,
                    sisa_stok: item.stok
                });
                localStorage.setItem('riwayatGudang', JSON.stringify(riwayatGudang));
                renderRiwayat(); 
                
                resultDiv.classList.add('alert-success');
                resultDiv.innerHTML = `<i class="fa-solid fa-circle-check fs-4"></i><br><b>Berhasil!</b><br>${qtyToDeduct} unit <b>${item.nama}</b> diambil oleh <b>${pengambil}</b>.<br>Sisa stok: <span class="badge bg-success">${item.stok}</span>`;
            } else {
                resultDiv.classList.add('alert-danger');
                resultDiv.innerHTML = `<i class="fa-solid fa-circle-xmark fs-4"></i><br><b>Gagal!</b><br>Jumlah melebihi stok yang ada atau tidak valid.`;
            }
        }

        bootstrap.Modal.getOrCreateInstance(document.getElementById('qtyModal')).hide();

        resultDiv.style.display = 'block';
        setTimeout(() => {
            resultDiv.style.display = 'none';
            if (html5QrcodeScanner.getState() === 3) {
                html5QrcodeScanner.resume();
            }
        }, 3000);
    }

    function cancelScan() {
        bootstrap.Modal.getOrCreateInstance(document.getElementById('qtyModal')).hide();
        if (html5QrcodeScanner && html5QrcodeScanner.getState() === 3) {
            html5QrcodeScanner.resume();
        }
    }

    function onScanFailure(error) {}

    document.querySelectorAll('button[data-bs-toggle="pill"]').forEach(tab => {
        tab.addEventListener('hidden.bs.tab', event => {
            if (event.target.id === 'pills-scan-tab' && html5QrcodeScanner) {
                html5QrcodeScanner.clear();
                html5QrcodeScanner = null;
            }
        });
    });

    window.onload = function() { checkAuthStatus(); };
</script>

</body>
</html>
